<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Changed</title>
    <style>
      @media (prefers-color-scheme: light) {
        body { background-color: #ffffff !important; }
        table table { background-color: #f5f5f5 !important; border-color: #e0e0e0 !important; }
        p { color: #333333 !important; }
        h1 { color: #006FEE !important; }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #0a0a0a; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="420"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #141414;
              border-radius: 16px;
              border: 1px solid #262626;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td style="padding: 32px 32px 0; text-align: center">
                <h1
                  style="
                    margin: 0;
                    font-size: 24px;
                    font-weight: 700;
                    color: #006FEE;
                    font-family: -apple-system, 'Segoe UI', sans-serif;
                    letter-spacing: -0.02em;
                  "
                >
                  Ekwe
                </h1>
                <p style="margin: 8px 0 0; font-size: 13px; color: #006FEE;">
                  Every voice understood.
                </p>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 24px 32px 8px; text-align: center">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    color: #a3a3a3;
                    line-height: 1.6;
                  "
                >
                  Your password has been changed successfully.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 8px 32px 32px; text-align: center">
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    color: #525252;
                    line-height: 1.5;
                  "
                >
                  If you didn't make this change, please contact support
                  immediately at support@ekwe.pages.dev.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  text-align: center;
                  border-top: 1px solid #262626;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #404040">
                  &copy; Ekwe &mdash; Every voice understood.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
