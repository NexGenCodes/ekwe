name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

defaults:
  tools:
    node: latest

jobs:
  quality:
    name: Lint & Typecheck & Test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src/ --max-warnings 0
      - name: Test
        run: npx jest --passWithNoTests
