apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply from: '../nitrogen/generated/android/ekwe_native_jni+autolinking.gradle'

import expo.modules.plugin.gradle.ExpoModuleExtension

// Inherit global properties
buildscript {
  // Simple helper that allows the root project to override versions declared by this library.
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

group = 'expo.modules.ekwenative'
version = '0.7.10'

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a"]
}

def expoModuleExtension = project.extensions.getByType(ExpoModuleExtension)

dependencies {
  implementation "androidx.cardview:cardview:1.0.0"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.lifecycle:lifecycle-process:2.8.7"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
  // Ensure React Native constants and ReactActivity are accessible
  implementation "com.facebook.react:react-android"
  // Expo notifications (ExpoFirebaseMessagingService) and FCM (RemoteMessage)
  implementation expoModuleExtension.getExpoDependency("expo-notifications")
  implementation "com.google.firebase:firebase-messaging:25.0.1"
  // Nitro Modules — exposes NitroModules prefab for CMake find_package()
  implementation project(':react-native-nitro-modules')
}

android {
  namespace "expo.modules.ekwenative"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
    externalNativeBuild {
      cmake {
        arguments(
          "-DANDROID_STL=c++_shared",
          "-DREACT_NATIVE_DIR=${expoModuleExtension.reactNativeDir}",
        )
        abiFilters (*reactNativeArchitectures())
      }
    }
  }
  buildFeatures {
    prefab true
  }
  externalNativeBuild {
    cmake {
      path = file("CMakeLists.txt")
    }
  }
  lintOptions {
    abortOnError false
  }
}
