<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0D0D12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#006FEE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006FEE"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#006FEE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#006FEE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#heroGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Logo -->
  <g transform="translate(112, 315)">
    <rect x="-32" y="-94" width="52" height="84" rx="28" fill="url(#brand)"/>
    <path d="M-46 -42 C-46 -2 -34 10 -14 10 C6 10 18 -2 18 -42" stroke="url(#brand)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M-14 10 L-14 30" stroke="url(#brand)" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-14" cy="38" rx="32" ry="10" stroke="url(#brand)" stroke-width="9" fill="none"/>
    <path d="M-66 -75 A 64 64 0 0 0 -66 11" stroke="#006FEE" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 38 -75 A 64 64 0 0 1 38 11" stroke="#006FEE" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-98 -88 A 90 90 0 0 0 -98 30" stroke="#7c3aed" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 70 -88 A 90 90 0 0 1 70 30" stroke="#7c3aed" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="308" font-family="Outfit, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Ekwe</text>
  <text x="250" y="372" font-family="Outfit, sans-serif" font-size="34" font-weight="600" fill="#A1A1AA">Voice notes, translated instantly.</text>

  <!-- Badge -->
  <g transform="translate(250, 424)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#006FEE" fill-opacity="0.15" stroke="#006FEE" stroke-opacity="0.4"/>
    <circle cx="20" cy="20" r="5" fill="#22c55e"/>
    <text x="36" y="26" font-family="Outfit, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">130+ languages</text>
  </g>
</svg>