name = "ekwe-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Daily history retention cleanup (free: 30d, pro: 365d) — calls
# cleanup_expired_history via the service role in the `scheduled` handler.
[triggers]
crons = ["0 3 * * *"]

[dev]
ip = "0.0.0.0"
port = 8787

[vars]
SUPABASE_URL = "https://zsjcgebczzbmaarfcdny.supabase.co"
ALLOWED_ORIGINS = "https://ekwe.app,https://www.ekwe.app"
# Frontend hostnames Turnstile siteverify must return for /auth/otp.
# The Turnstile widget must be registered for these domains (add localhost for
# local dev via .dev.vars — never in this production default).
TURNSTILE_HOSTNAMES = "ekwe.app"
# Default to production so deploys never ship with debug logging / dev CORS.
# Override to "development" locally via .dev.vars (precedence over [vars]).
APP_ENV = "production"

[observability]
enabled = true
logs = { head_sampling_rate = 1 }
traces = { enabled = true, head_sampling_rate = 0.01 }

[[kv_namespaces]]
binding = "EKWE_KV"
id = "2a61656b51414ff4ae7cbc13a53fb459"

[[ratelimits]]
name = "RATE_LIMITER"
# Must be a string containing a positive integer, unique per Cloudflare account.
# Two bindings with the same namespace_id SHARE counters, so don't reuse "1".
# Value derived from the worker name ("ekwe-proxy"): ekwe=1100, proxy=28401.
namespace_id = "28401"
simple = { limit = 500, period = 60 } # 500 requests per minute - global edge guard

[ai]
binding = "AI"

# Live-transcription sessions. One DO instance per user (getByName(userId))
# so WebSockets survive worker-isolate churn and idle sessions can hibernate.
[[durable_objects.bindings]]
name = "STREAM_DO"
class_name = "StreamDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamDurableObject"]
