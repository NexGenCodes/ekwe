name = "ekwe-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = true }
]
[dev]
ip = "0.0.0.0"
port = 8787

[vars]
SUPABASE_URL = "https://zsjcgebczzbmaarfcdny.supabase.co"
ALLOWED_ORIGINS = "https://ekwe.app,https://www.ekwe.app"
APP_ENV = "development"

[observability]
enabled = true
logs = { head_sampling_rate = 1 }
traces = { enabled = true, head_sampling_rate = 0.01 }

[[kv_namespaces]]
binding = "EKWE_KV"
id = "2a61656b51414ff4ae7cbc13a53fb459"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1"
simple = { limit = 500, period = 60 } # 500 requests per minute - global edge guard

[ai]
binding = "AI"
