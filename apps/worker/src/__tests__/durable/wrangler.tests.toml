# Test-only Wrangler config for `@cloudflare/vitest-pool-workers`.
# Lives in tests/durable/ so miniflare doesn't auto-load the root `.dev.vars`
# (real provider secrets). Kept intentionally minimal: only the Durable Object
# the tests exercise. Provider keys are omitted so sessions deterministically
# end with NO_PROVIDER_AVAILABLE instead of dialing real transcription providers.
name = "ekwe-proxy-tests"
main = "main.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = true }
]

# Local in-memory KV so the stream quota preflight gate (`env.EKWE_KV`) can
# run without dialing production storage.
[[kv_namespaces]]
binding = "EKWE_KV"
id = "00000000000000000000000000000000"

# The stream preflight gate reads daily/monthly usage from D1. The tables are
# created in `durable/setup.ts`; the binding is only present to exercise that
# path, not to persist anything between test runs.
[[d1_databases]]
binding = "DB"
database_name = "ekwe-tests"
database_id = "00000000-0000-0000-0000-000000000000"

# `getDb` is D1-backed, but the DO tests replace it with an in-memory,
# Drizzle-shaped stand-in via `vi.mock` so each suite gets deterministic query
# results. The DB binding above is still used by the stream preflight gate,
# whose daily/monthly tables are created in `durable/setup.ts`.
[[durable_objects.bindings]]
name = "STREAM_DO"
class_name = "StreamDurableObject"

[[durable_objects.bindings]]
name = "THROTTLE_DO"
class_name = "ThrottleBucket"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamDurableObject"]

[[migrations]]
tag = "v2"
new_classes = ["ThrottleBucket"]
