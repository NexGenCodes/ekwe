name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      supabase: ${{ steps.changes.outputs.supabase }}
      worker: ${{ steps.changes.outputs.worker }}
      pages: ${{ steps.changes.outputs.pages }}
      ota: ${{ steps.outcome.outputs.ota }}
      release: ${{ steps.outcome.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            supabase:
              - 'supabase/**'
            worker:
              - 'apps/worker/**'
            pages:
              - 'apps/web/**'
            ota:
              - 'apps/mobile/src/**'
            release:
              - 'apps/mobile/app.json'
              - 'apps/mobile/app.config.*'
              - 'apps/mobile/package.json'
              - 'apps/mobile/android/**'
              - 'apps/mobile/ios/**'
              - 'apps/mobile/eas.json'
              - 'pnpm-lock.yaml'
              - 'package.json'

      - name: Classify change
        id: outcome
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "ota=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            AUTHOR=$(git log -1 --format='%an')
            MSG=$(git log -1 --format='%s')
            if [[ "$AUTHOR" == "github-actions[bot]" && "$MSG" == "chore: release v"* ]]; then
              echo "ota=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              if [ "${{ steps.changes.outputs.release }}" == "true" ]; then
                echo "ota=false" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
              else
                echo "ota=${{ steps.changes.outputs.ota }}" >> "$GITHUB_OUTPUT"
                echo "release=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  supabase:
    name: Deploy Supabase
    needs: detect
    if: needs.detect.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-all
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  worker:
    name: Deploy Worker
    needs: [detect, supabase]
    if: always() && needs.detect.outputs.worker == 'true' && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: Deploy Landing Site
    needs: detect
    if: needs.detect.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build landing site
        run: node apps/web/build.mjs
      - name: Deploy to Cloudflare Pages
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy ../web/dist --project-name ekwe --branch master

  ota:
    name: Publish OTA Update
    needs: detect
    if: needs.detect.outputs.ota == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write mobile .env
        run: echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas update --platform android --channel production --message "OTA update from ${{ github.sha }}" --non-interactive

  release:
    name: Build APK + Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/node_modules /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android/sdk/.meta || true
          df -h /

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null 2>&1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write mobile .env
        run: echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}

      - name: Resolve version + derive versionCode
        id: version
        run: |
          LAST_VERSION_FILE="version.json"
          CURRENT_VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          node scripts/bump-version.mjs "$LAST_VERSION_FILE" "$CURRENT_VERSION" "$GITHUB_OUTPUT"
          source "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run prebuild
        working-directory: apps/mobile
        run: pnpm run prebuild:android

      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon -x lintVitalAnalyzeRelease

      - name: Stage release assets
        id: assets
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" ! -name "*androidTest*" | head -1)
          mkdir -p dist
          cp "$APK" dist/app-release.apk
          sha256sum dist/app-release.apk | awk '{print $1}' > dist/app-release.apk.sha256
          echo "size=$(stat -c%s dist/app-release.apk)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat dist/app-release.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Write version manifest
        run: node scripts/generate-update-manifest.mjs "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version_code }}" "${{ steps.assets.outputs.sha256 }}" "${{ steps.assets.outputs.size }}"

      - name: Update CHANGELOG
        run: |
          DATE=$(date +'%Y-%m-%d')
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${DATE}/g" CHANGELOG.md

      - name: Commit version bump + manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json package.json version.json apps/web/config.json CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin "${{ github.event.repository.default_branch }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
            dist/version.json
          generate_release_notes: true

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          pip install --quiet awscli
          aws s3 cp dist/app-release.apk "s3://${{ secrets.R2_BUCKET_NAME }}/app-release.apk" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/vnd.android.package-archive"
          aws s3 cp dist/version.json "s3://${{ secrets.R2_BUCKET_NAME }}/version.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/json"

      - name: Publish manifest + notify devices
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
        run: |
          curl -fsS -X POST "$WORKER_URL/update/manifest" \
            -H "Authorization: Bearer $PUSH_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            --data @dist/version.json
          curl -fsS -X POST "$WORKER_URL/push-notify" \
            -H "Authorization: Bearer $PUSH_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"version": "${{ steps.version.outputs.version }}", "versionCode": ${{ steps.version.outputs.version_code }}, "checksumSha256": "${{ steps.assets.outputs.sha256 }}", "downloadUrl": "https://pub-dcd31dbfad344d278cc48d4601c658fc.r2.dev/app-release.apk"}'
