name: Deploy (OTA + Release)

# One workflow for everything you push to master:
#   - Only apps/mobile/src/** changed  -> OTA update (no version bump needed)
#   - Version/native/config changed    -> full APK release + GitHub Release + device notify
#   - Both changed in one push         -> both happen
# Just bump the version in apps/mobile/app.json to trigger a release.
# CI derives versionCode from the version (1.2.3 -> 10203); keep segments < 100.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        description: Also build and publish an APK release
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ota: ${{ steps.outcome.outputs.ota }}
      release: ${{ steps.outcome.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: paths
        if: github.event_name == 'push'
        with:
          filters: |
            ota:
              - 'apps/mobile/src/**'
            release:
              - 'apps/mobile/app.json'
              - 'apps/mobile/app.config.*'
              - 'apps/mobile/package.json'
              - 'apps/mobile/android/**'
              - 'apps/mobile/ios/**'
              - 'apps/mobile/eas.json'
              - 'pnpm-lock.yaml'
              - 'package.json'

      - name: Classify change (push filters or manual dispatch)
        id: outcome
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            # Manual dispatch: OTA by default, release only if explicitly requested.
            echo "ota=true" >> "$GITHUB_OUTPUT"
            echo "release=${{ inputs.publish_release }}" >> "$GITHUB_OUTPUT"
          else
            # A release job commits the version bump + manifest and pushes it.
            # That push must NOT re-trigger itself, or we'd loop forever
            # (1.0.1 -> push -> 1.0.2 -> push -> ...). Skip such pushes.
            AUTHOR=$(git log -1 --format='%an')
            MSG=$(git log -1 --format='%s')
            if [[ "$AUTHOR" == "github-actions[bot]" && "$MSG" == "chore: release v"* ]]; then
              echo "ota=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "ota=${{ steps.paths.outputs.ota }}" >> "$GITHUB_OUTPUT"
              echo "release=${{ steps.paths.outputs.release }}" >> "$GITHUB_OUTPUT"
            fi
          fi

  ota:
    name: Publish OTA Update
    needs: detect
    if: needs.detect.outputs.ota == 'true'
    runs-on: ubuntu-latest
    env:
      # Override the dev value in .env so OTA bundles are built as production.
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write mobile .env (EXPO_PUBLIC_* vars for bundle inlining)
        run: |
          echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}

      - name: Install EAS CLI
        # pnpm's global bin dir isn't on PATH on runners; npm's is.
        run: npm install -g eas-cli

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas update --platform android --channel production --message "OTA update from ${{ github.sha }}" --non-interactive

  release:
    name: Build APK + Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      # Override the dev value in .env so release bundles are built as production.
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/node_modules /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android/sdk/.meta || true
          df -h /

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        # The ekwe-native module has a C++/CMake build pinned to this NDK. It is
        # NOT preinstalled on ubuntu-latest, so without this step assembleRelease
        # fails with "NDK not configured".
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null 2>&1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write mobile .env (EXPO_PUBLIC_* vars for bundle inlining)
        run: |
          echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}

      - name: Ensure on default branch for commit
        # Push checkout is already on master, but this guarantees we can commit
        # the auto-bumped version + manifest back to the branch (no detached HEAD).
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          git checkout "$DEFAULT_BRANCH"

      - name: Resolve version (auto-bump patch) + derive versionCode
        id: version
        run: |
          LAST=$(node -p "require('./version.json').latest_version" 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./apps/mobile/app.json').expo.version")

          # Resolve the version to ship:
          #   - current > last release  -> respect the manual bump (minor/major)
          #   - current == last release -> auto-bump the patch (normal push)
          #   - current <  last release -> error (version can never go backwards)
          NEXT=$(node -e '
            (function () {
              const last = process.argv[1].split(".").map(Number);
              const cur = process.argv[2].split(".").map(Number);
              const cmp = (a, b) => a[0]-b[0] || a[1]-b[1] || a[2]-b[2];
              const c = cmp(cur, last);
              if (c > 0) { process.stdout.write(cur.join(".")); return; }
              if (c < 0) {
                console.error("app.json version (" + cur.join(".") + ") is lower than the last release (" + last.join(".") + "). Set it higher.");
                process.exit(1);
              }
              cur[2] += 1;
              process.stdout.write(cur.join("."));
            })();
          ' "$LAST" "$CURRENT")
          if [[ -z "$NEXT" ]]; then exit 1; fi

          IFS=. read -r M m p <<< "$NEXT"
          if (( M > 99 || m > 99 || p > 99 )); then
            echo "::error::Version segments must be < 100 so versionCode stays unique (got $NEXT)."
            exit 1
          fi
          VC=$(( M * 10000 + m * 100 + p ))

          # Bake the resolved version + derived versionCode into app.json, and
          # keep package.json in sync, so the committed repo matches what was built.
          node -e "
            const fs = require('fs');
            const a = './apps/mobile/app.json';
            const j = require(a);
            j.expo.version = '$NEXT';
            j.expo.android.versionCode = $VC;
            fs.writeFileSync(a, JSON.stringify(j, null, 2) + '\n');
            const p = './apps/mobile/package.json';
            const k = require(p);
            k.version = '$NEXT';
            fs.writeFileSync(p, JSON.stringify(k, null, 2) + '\n');
          "

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Run prebuild (generate native Android project)
        working-directory: apps/mobile
        run: pnpm run prebuild:android

      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon -x lintVitalAnalyzeRelease

      - name: Stage release assets
        id: assets
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" ! -name "*androidTest*" | head -1)
          mkdir -p dist
          cp "$APK" dist/app-release.apk
          sha256sum dist/app-release.apk | awk '{print $1}' > dist/app-release.apk.sha256
          echo "size=$(stat -c%s dist/app-release.apk)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat dist/app-release.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Write version manifest
        run: |
          DOWNLOAD_URL="https://pub-dcd31dbfad344d278cc48d4601c658fc.r2.dev/app-release.apk"
          DATE=$(date -u +%Y-%m-%d)

          jq -n \
            --arg v "${{ steps.version.outputs.version }}" \
            --argjson vc "${{ steps.version.outputs.version_code }}" \
            --arg url "$DOWNLOAD_URL" \
            --arg sha "${{ steps.assets.outputs.sha256 }}" \
            --argjson size "${{ steps.assets.outputs.size }}" \
            --arg date "$DATE" \
            '{latest_version: $v, latest_version_code: $vc, min_supported_version_code: 1, download_url: $url, checksum_sha256: $sha, file_size: $size, release_notes: "", release_date: $date, force_update: false}' \
            > version.json

          cp version.json dist/version.json

      - name: Commit version bump + manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json version.json
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin "${{ github.event.repository.default_branch }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
            dist/version.json
          generate_release_notes: true

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          pip install --quiet awscli
          aws s3 cp dist/app-release.apk "s3://${{ secrets.R2_BUCKET_NAME }}/app-release.apk" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/vnd.android.package-archive"
          aws s3 cp dist/version.json "s3://${{ secrets.R2_BUCKET_NAME }}/version.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/json"

      - name: Publish manifest + notify devices
        # Store the manifest in Worker KV (GET /update/manifest serves it) and
        # push the APK update notification to every registered Android device.
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
        run: |
          curl -fsS -X POST "$WORKER_URL/update/manifest" \
            -H "Authorization: Bearer $PUSH_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            --data @dist/version.json
          curl -fsS -X POST "$WORKER_URL/push-notify" \
            -H "Authorization: Bearer $PUSH_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"version": "${{ steps.version.outputs.version }}", "versionCode": ${{ steps.version.outputs.version_code }}, "checksumSha256": "${{ steps.assets.outputs.sha256 }}", "downloadUrl": "https://pub-dcd31dbfad344d278cc48d4601c658fc.r2.dev/app-release.apk"}'