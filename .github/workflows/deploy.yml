name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
      pages: ${{ steps.changes.outputs.pages }}
      ota: ${{ steps.outcome.outputs.ota }}
      release: ${{ steps.outcome.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            worker:
              - 'apps/worker/**'
            pages:
              - 'apps/web/**'
            ota:
              - 'apps/mobile/src/**'
            native:
              - 'apps/mobile/app.json'
              - 'apps/mobile/app.config.*'
              - 'apps/mobile/package.json'
              - 'apps/mobile/android/**'
              - 'apps/mobile/ios/**'
              - 'apps/mobile/modules/ekwe-native/**'
              - 'apps/mobile/eas.json'
              - 'pnpm-lock.yaml'
              - 'package.json'

      - name: Classify change
        id: outcome
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            # Manual dispatch: full release. A release embeds the JS so no OTA
            # is needed; the landing site is superseded by the released APKs,
            # so it stays off (the pages job also guards on release != true).
            echo "ota=false" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "pages=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.changes.outputs.native }}" == "true" ]; then
              echo "ota=false" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              # Non-native change: only OTA unless it's a release (never both).
              echo "ota=${{ steps.changes.outputs.ota }}" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  worker:
    name: Deploy Worker
    needs: detect
    if: needs.detect.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: Deploy Landing Site
    needs: detect
    if: needs.detect.outputs.pages == 'true' && needs.detect.outputs.release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build landing site
        run: node apps/web/build.mjs
      - name: Deploy to Cloudflare Pages
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy ../web/dist --project-name ekwe --branch master

  ota:
    name: Publish OTA Update
    needs: detect
    if: needs.detect.outputs.ota == 'true' && needs.detect.outputs.release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write mobile .env
        run: echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas update --platform android --channel production --message "OTA update from ${{ github.sha }}" --non-interactive

  release:
    name: Build APK + Release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/node_modules /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android/sdk/.meta || true
          df -h /

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null 2>&1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write mobile .env
        run: echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}

      - name: Read current version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          VERSION_CODE=$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Auto-bump patch version
        id: bump
        run: |
          node scripts/bump-version.mjs "${{ steps.version.outputs.version }}" .bump.env
          source .bump.env
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "next_version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "next_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run prebuild
        working-directory: apps/mobile
        run: pnpm run prebuild:android

      - name: Build Release APKs
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.caching=true"
        run: |
          chmod +x gradlew
          # ABI splits are enabled via the ekwe-native config plugin, so a single
          # gradle run compiles both ABIs once and emits per-ABI APKs
          # (app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk) that the
          # asset staging step below matches. reactNativeArchitectures defaults
          # to armeabi-v7a,arm64-v8a in gradle.properties.
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease

      - name: Stage release assets
        id: assets
        run: |
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a; do
            APK=$(find apps/mobile/android/app/build/outputs/apk -name "*${ABI}*" ! -name "*androidTest*" | head -1)
            if [ -z "$APK" ]; then
              echo "::error::No APK found for ABI $ABI"
              exit 1
            fi
            cp "$APK" "dist/app-${ABI}-release.apk"
            sha256sum "dist/app-${ABI}-release.apk" | awk '{print $1}' > "dist/app-${ABI}.sha256"
            echo "${ABI}_size=$(stat -c%s "dist/app-${ABI}-release.apk")" >> "$GITHUB_OUTPUT"
            echo "${ABI}_sha256=$(cat "dist/app-${ABI}.sha256")" >> "$GITHUB_OUTPUT"
          done

      - name: Write version manifest
        run: |
          node scripts/generate-update-manifest.mjs \
            "${{ steps.bump.outputs.next_version }}" \
            "${{ steps.bump.outputs.next_version_code }}" \
            "${{ steps.assets.outputs.arm64-v8a_sha256 }}" \
            "${{ steps.assets.outputs.arm64-v8a_size }}" \
            "${{ steps.assets.outputs.armeabi-v7a_sha256 }}" \
            "${{ steps.assets.outputs.armeabi-v7a_size }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json package.json apps/web/config.json CHANGELOG.md
          git commit -m "chore: release ${{ steps.bump.outputs.next_tag }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.next_tag }}
          name: ${{ steps.bump.outputs.next_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/app-arm64-v8a-release.apk
            dist/app-arm64-v8a.sha256
            dist/app-armeabi-v7a-release.apk
            dist/app-armeabi-v7a.sha256
            dist/version.json
          generate_release_notes: true

      - name: Upload APKs to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          pip install --quiet awscli
          for ABI in arm64-v8a armeabi-v7a; do
            aws s3 cp "dist/app-${ABI}-release.apk" "s3://${{ secrets.R2_BUCKET_NAME }}/app-${ABI}-release.apk" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --content-type "application/vnd.android.package-archive"
          done
          aws s3 cp dist/version.json "s3://${{ secrets.R2_BUCKET_NAME }}/version.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/json"

      - name: Publish manifest + notify devices
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
        run: |
          curl -fsS -X POST "$WORKER_URL/update/manifest" \
            -H "Authorization: Bearer $PUSH_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            --data @dist/version.json
          curl -fsS -X POST "$WORKER_URL/push-notify" \
            -H "Authorization: Bearer $PUSH_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ steps.bump.outputs.next_version }}",
              "versionCode": ${{ steps.bump.outputs.next_version_code }},
              "downloadUrl": "https://pub-dcd31dbfad344d278cc48d4601c658fc.r2.dev/app-armeabi-v7a-release.apk",
              "downloadUrls": {
                "arm64-v8a": "https://pub-dcd31dbfad344d278cc48d4601c658fc.r2.dev/app-arm64-v8a-release.apk",
                "armeabi-v7a": "https://pub-dcd31dbfad344d278cc48d4601c658fc.r2.dev/app-armeabi-v7a-release.apk"
              },
              "checksums": {
                "arm64-v8a": "${{ steps.assets.outputs.arm64-v8a_sha256 }}",
                "armeabi-v7a": "${{ steps.assets.outputs.armeabi-v7a_sha256 }}"
              }
            }'

      - name: Rebuild landing site
        run: node apps/web/build.mjs
      - name: Deploy landing site
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy ../web/dist --project-name ekwe --branch master
