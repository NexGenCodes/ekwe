name: Deploy

on:
  push:
    branches: [master]
    # The release bot's version-bump commit touches exactly these files. Ignoring
    # them means its push never creates a run here — which is what breaks the
    # release loop AND prevents cancel-in-progress from killing the still-running
    # release job right after the push. Real code changes still trigger normally.
    paths-ignore:
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "package.json"
      - "apps/web/config.json"
      - "apps/web/package.json"
      - "packages/shared/src/version.ts"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      notify:
        description: |
          Force a push notification even for a patch release (hotfixes). Minor
          and major releases push automatically; routine patch releases are
          surfaced in-app via the update badge on the Profile tab instead.
        required: false
        type: boolean
        default: false
      release_type:
        description: |
          Semver component to bump. Patch releases are badge-only; minor and
          major releases also push a notification to existing Android users.
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release_notes:
        description: |
          Curated release notes for this release (optional). Written to
          CHANGELOG.md and used as the GitHub release body. When omitted, the
          workflow falls back to GitHub's auto-generated notes.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.outcome.outputs.worker }}
      pages: ${{ steps.outcome.outputs.pages }}
      ota: ${{ steps.outcome.outputs.ota }}
      release: ${{ steps.outcome.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            worker:
              - 'apps/worker/**'
              - 'packages/shared/**'
            pages:
              - 'apps/web/**'
              - 'packages/shared/**'
            ota:
              - 'apps/mobile/src/**'
              - 'packages/shared/**'
            native:
              - 'apps/mobile/app.json'
              - 'apps/mobile/app.config.*'
              - 'apps/mobile/package.json'
              - 'apps/mobile/android/**'
              - 'apps/mobile/ios/**'
              - 'apps/mobile/modules/ekwe-native/**'
              - 'apps/mobile/eas.json'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

      - name: Classify change
        id: outcome
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            # Manual dispatch: full release. A release embeds the JS so no OTA
            # is needed; the landing site is superseded by the released APKs,
            # so it stays off (the pages job also guards on release != true).
            echo "ota=false" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "pages=false" >> "$GITHUB_OUTPUT"
          else
            # A release job commits the version bump and pushes it; that push
            # must not re-trigger itself or we'd bump versions forever
            # (1.0.1 -> push -> 1.0.2 -> push -> ...). paths-ignore on the push
            # event already prevents that run from being created; this guard is
            # defense-in-depth in case the ignore list ever goes stale.
            AUTHOR=$(git log -1 --format='%an')
            MSG=$(git log -1 --format='%s')
            if [ "$AUTHOR" = "github-actions[bot]" ] && [[ "$MSG" == "chore: release v"* ]]; then
              echo "ota=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "worker=false" >> "$GITHUB_OUTPUT"
              echo "pages=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${{ steps.changes.outputs.native }}" == "true" ]; then
              echo "ota=false" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "worker=${{ steps.changes.outputs.worker }}" >> "$GITHUB_OUTPUT"
              echo "pages=${{ steps.changes.outputs.pages }}" >> "$GITHUB_OUTPUT"
            else
              # Non-native change: only OTA unless it's a release (never both).
              echo "ota=${{ steps.changes.outputs.ota }}" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "worker=${{ steps.changes.outputs.worker }}" >> "$GITHUB_OUTPUT"
              echo "pages=${{ steps.changes.outputs.pages }}" >> "$GITHUB_OUTPUT"
            fi
          fi

  verify-ci:
    name: Gate on green CI
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      green: ${{ steps.ci.outputs.green }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the CI run on this commit
        id: ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Poll the ci.yml run for the exact commit being deployed. Fails (and
          # therefore blocks any release) if CI is red or never finishes. For
          # PR-merged commits CI is already conclusively green, so this returns
          # in one iteration.
          for _ in $(seq 1 120); do
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA" \
              --jq '[.workflow_runs[] | select(.name == "CI")][-1]' 2>/dev/null)
            if [ -n "$RUN" ]; then
              STATUS=$(printf '%s' "$RUN" | jq -r '.status')
              CONCL=$(printf '%s' "$RUN" | jq -r '.conclusion')
              case "$CONCL" in
                success)
                  echo "green=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                failure|cancelled|timed_out|action_required)
                  echo "::error::CI concluded '$CONCL' for $SHA; refusing to release"
                  echo "green=false" >> "$GITHUB_OUTPUT"
                  exit 1
                  ;;
              esac
              if [ "$STATUS" = "completed" ]; then
                echo "::error::CI completed with '$CONCL' for $SHA; refusing to release"
                echo "green=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for CI on $SHA"
          echo "green=false" >> "$GITHUB_OUTPUT"
          exit 1

  worker:
    name: Deploy Worker
    needs: detect
    if: "!cancelled() && needs.detect.outputs.worker == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply ekwe --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: Deploy Landing Site
    needs: detect
    if: needs.detect.outputs.pages == 'true' && needs.detect.outputs.release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build landing site
        run: pnpm --filter @ekwe/web build
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy --branch master

  ota:
    name: Publish OTA Update
    needs: detect
    if: needs.detect.outputs.ota == 'true' && needs.detect.outputs.release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write mobile .env
        run: echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas update --platform android --channel production --message "OTA update from ${{ github.sha }}" --non-interactive

      - name: Upload OTA sourcemaps to Sentry
        # EAS Update bundles into dist/ but (unlike native builds) does NOT
        # auto-upload sourcemaps; the @sentry/react-native/expo plugin + Metro
        # plugin already assigned Debug IDs, so errors from this update are
        # symbolicated once the maps land in Sentry (see docs.sentry.io
        # "Manually upload source maps for EAS Updates").
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: public-benefit-nonprofit
          SENTRY_PROJECT: react-native
        run: npx sentry-expo-upload-sourcemaps dist

  release:
    name: Build APK + Release
    needs: [detect, verify-ci]
    if: "!cancelled() && needs.detect.outputs.release == 'true' && needs.verify-ci.outputs.green == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Headroom for R8 minify + resource shrinking + bundle compression, which
    # are enabled on top of the C++/Hermes build of a universal APK.
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_ENV: production
      # app.config.js keys off APP_ENV (not EXPO_PUBLIC_ENV) to enable the
      # production reactNativeArchitectures / build properties during prebuild.
      APP_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/node_modules /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android/sdk/.meta || true
          df -h /

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v4
        # The default `tools platform-tools` package list references the
        # deprecated `tools` package, which is no longer in the SDK repo and
        # makes sdkmanager exit non-zero. Hosted runners ship pre-accepted
        # licenses; we only need the license acceptance side of the action.
        with:
          packages: ""

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null 2>&1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write mobile .env
        run: echo "$MOBILE_ENV" | base64 -d > apps/mobile/.env
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}

      - name: Read current version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('fs').readFileSync('packages/shared/src/version.ts','utf8').match(/APP_VERSION\s*=\s*\"([^\"]+)\"/)[1])")
          VERSION_CODE=$(node -e "console.log(require('fs').readFileSync('packages/shared/src/version.ts','utf8').match(/APP_VERSION_CODE\s*=\s*(\d+)/)[1])")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Auto-bump version
        id: bump
        run: |
          node scripts/bump-version.mjs \
            "${{ steps.version.outputs.version }}" \
            .bump.env \
            "${{ github.event.inputs.release_type || 'patch' }}"
          source .bump.env
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "next_version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "next_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide whether to notify users
        id: notify
        # Rule: minor/major releases notify automatically; patch releases are
        # badge-only unless explicitly forced via the `notify` dispatch input.
        run: |
          TYPE="${{ github.event.inputs.release_type || 'patch' }}"
          FORCE="${{ github.event.inputs.notify || 'false' }}"
          if [ "$TYPE" != "patch" ] || [ "$FORCE" = "true" ]; then
            echo "Sending push notification (release_type=$TYPE, forced=$FORCE)"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "Badge-only release (release_type=$TYPE) — no push"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes to changelog
        # Only manual dispatches carry curated notes; the release commit then
        # includes CHANGELOG.md, and the landing-site rebuild below renders it.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_notes != ''
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          mkdir -p dist
          printf '%s' "$RELEASE_NOTES" > dist/release-notes.md
          node scripts/append-changelog.mjs "${{ steps.bump.outputs.next_version }}" dist/release-notes.md

      - name: Run prebuild
        working-directory: apps/mobile
        env:
          # Included in the compiled native config by the Sentry Expo plugin
          # (@sentry/react-native/expo reads these in app.config.js).
          SENTRY_ORG: public-benefit-nonprofit
          SENTRY_PROJECT: react-native
        run: pnpm run prebuild:android

      - name: Configure release signing
        # Decodes the production keystore from a repo secret and writes the
        # gitignored keystore.properties that the app.config.js build-gradle
        # plugin reads. When the secret is absent (e.g. first rollout before
        # secrets are set) the gradle plugin falls back to debug signing.
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/ekwe-release.keystore"
            printf '%s\n' \
              "storeFile=$RUNNER_TEMP/keys/ekwe-release.keystore" \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "keyPassword=$KEY_PASSWORD" \
              > apps/mobile/android/keystore.properties
          fi

      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.caching=true"
          # Upload JS source maps + the R8/ProGuard mapping.txt to Sentry during
          # assembleRelease (SDK >= 8 wires @sentry/cli into the gradle build;
          # the token secret drives the upload).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: public-benefit-nonprofit
          SENTRY_PROJECT: react-native
        run: |
          chmod +x gradlew
          # One universal APK is built containing both ABIs (arm64-v8a +
          # armeabi-v7a per reactNativeArchitectures in gradle.properties), so
          # every device gets the same file.
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease

      - name: Stage release asset
        id: assets
        run: |
          mkdir -p dist
          APK=$(find apps/mobile/android/app/build/outputs/apk -name "*release*.apk" ! -name "*androidTest*" ! -name "*universal*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          cp "$APK" "dist/app-release.apk"
          sha256sum "dist/app-release.apk" | awk '{print $1}' > "dist/app-release.sha256"
          echo "sha256=$(cat "dist/app-release.sha256")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "dist/app-release.apk")" >> "$GITHUB_OUTPUT"

      - name: Write version manifest
        run: |
          node scripts/generate-update-manifest.mjs \
            "${{ steps.bump.outputs.next_version }}" \
            "${{ steps.bump.outputs.next_version_code }}" \
            "${{ steps.assets.outputs.sha256 }}" \
            "${{ steps.assets.outputs.size }}"

      - name: Prepare release body
        # Curated notes win (workflow_dispatch); push-triggered releases fall
        # back to the git log since the previous tag so the bump commit and the
        # GitHub release carry a real description instead of a bare version line.
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          mkdir -p dist
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > dist/release-body.md
          else
            FROM="${{ steps.version.outputs.tag }}"
            if ! git rev-parse --verify -q "refs/tags/$FROM" >/dev/null 2>&1; then
              # Releasing a version that has no tag yet (first run / manual
              # release before any tag exists): fall back to the latest commits
              # instead of failing the range lookup.
              FROM="$(git log --format=%H -n 20 | tail -1)"
            fi
            {
              echo "**Changes since ${FROM}**"
              echo ""
              git log "${FROM}..HEAD" \
                --pretty=format:'- %s' --no-merges \
                | grep -vE '^[- ]*chore: release v' || true
            } > dist/release-body.md
          fi

      - name: Commit + push version bump
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json package.json apps/web/config.json apps/web/package.json packages/shared/src/version.ts CHANGELOG.md
          # Skip the commit when the bump produced no changes (releasing exactly
          # v1.2.0 when files are already at 1.2.0). Skip pre-commit hooks too,
          # since lint-staged's prettier re-staging makes its own emptiness guard
          # reject these scripted release commits.
          if ! git diff --cached --quiet; then
            { printf 'chore: release %s\n\n' "${{ steps.bump.outputs.next_tag }}"; cat dist/release-body.md; } > /tmp/release-commit-msg
            git commit --no-verify -F /tmp/release-commit-msg
          fi
          # Safe to push mid-run: paths-ignore on this push event means this
          # commit does NOT create a new run, so cancel-in-progress can't kill us.
          # A developer may have pushed during the ~90-min build: rebase the
          # bump commit onto that latest master instead of having the push
          # rejected as non-fast-forward (which used to fail the whole release).
          # The prebuild/build steps regenerate tracked native files, and a dirty
          # worktree makes `git pull --rebase` abort before it can fast-forward.
          # None of those changes belong in the release commit (the assets we
          # still need live under the untracked dist/ directory), so discard
          # them before syncing with the remote.
          git checkout -- .
          git pull --rebase
          git push
          # Capture AFTER the rebase+push: if the rebase rewrote the bump
          # commit (remote advanced mid-run), the pre-rebase HEAD is an unpushed
          # commit and the Release's target_commitish / OTA git_ref dangle.
          echo "next_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.next_tag }}
          name: ${{ steps.bump.outputs.next_tag }}
          target_commitish: ${{ steps.commit.outputs.next_sha }}
          files: |
            dist/app-release.apk
            dist/app-release.sha256
            dist/version.json
          body_path: dist/release-body.md

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Remove legacy per-ABI APKs — replaced by the single universal APK,
          # and the old builds must never be served as latest.
          for stale in app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-universal-release.apk; do
            aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/$stale" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" || true
          done
          aws s3 cp "dist/app-release.apk" "s3://${{ secrets.R2_BUCKET_NAME }}/app-release.apk" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp dist/version.json "s3://${{ secrets.R2_BUCKET_NAME }}/version.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type "application/json" \
            --cache-control "no-store"

      - name: Publish manifest + notify devices
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          UPDATE_NOTIFY_SECRET: ${{ secrets.UPDATE_NOTIFY_SECRET }}
        run: |
          # Download URL comes from apps/web/config.json (single source of
          # truth); the bumped config.json is already on disk at this point.
          DOWNLOAD_URL=$(node -p "require('./apps/web/config.json').links.download")
          curl -fsS -X POST "$WORKER_URL/admin/update/manifest" \
            -H "Authorization: Bearer $UPDATE_NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            --data @dist/version.json
          # Push decision comes from the "Decide whether to notify users" step
          # (minor/major releases, or an explicitly forced patch).
          if [[ "${{ steps.notify.outputs.value }}" == "true" ]]; then
            curl -fsS -X POST "$WORKER_URL/admin/update/notify" \
              -H "Authorization: Bearer $UPDATE_NOTIFY_SECRET" \
              -H "Content-Type: application/json" \
              -d "{
                \"version\": \"${{ steps.bump.outputs.next_version }}\",
                \"versionCode\": ${{ steps.bump.outputs.next_version_code }},
                \"downloadUrl\": \"$DOWNLOAD_URL\",
                \"checksumSha256\": \"${{ steps.assets.outputs.sha256 }}\"
              }"
          else
            echo "Skipping /admin/update/notify: patch release (users see the in-app update badge)"
          fi

      - name: Rebuild landing site
        run: node apps/web/build.mjs
      - name: Deploy landing site
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy --branch master
