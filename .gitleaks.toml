title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Dummy/placeholder credentials used only in tests and env templates"
regexes = [
  '''FLWPUBK_TEST-abc123''',
  '''FLWSECK_TEST-abc123''',
  '''FLWPUBK-abc123''',
  '''FLWSECK-abc123''',
  '''sk_test_abc123def456''',
  # Flutterwave TEST-mode key pair in apps/mobile/.env.example (matched exactly;
  # treating the full string as a constant unit rather than per-part regexes).
  '''FLWPUBK_TEST-431faadc1b0f600baf9b2004f4974573-X''',
  '''FLWSECK_TESTe4a8c93f9420''',
  # Google/Firebase project API key in google-services.json — public by design
  # (shipped in every Android build; access is governed server-side / App Check).
  '''AIzaSyDl4YPne5Kz6QLv5KKaebfpb4BRtpnCX6k''',
  # Empty provider-key placeholders in apps/worker/.dev.vars.example
  # (ASSEMBLYAI_KEY_1=, MISTRAL_KEY_2=, etc.) — no value, so nothing to leak.
  '''^[A-Z0-9_]+_KEY_[0-9]+=$''',
  # Public Edge-TTS client token in apps/worker/src/providers/edge.ts. It is a
  # fixed constant every Edge client sends, not a credential: it authorises
  # nothing on our side and grants no access to any account or resource.
  '''6A5AA1D4EAFF4E9FB37E23D68491D6F4''',
]
