packages:
  - apps/*
  - packages/*
allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  dtrace-provider: false
  es5-ext: true
  esbuild: true
  msw: false
  protobufjs: true
  workerd: true
minimumReleaseAgeExclude:
  - expo-updates@57.0.14
  - '@sentry/browser-utils@10.75.0'
  - '@sentry/browser@10.75.0'
  - '@sentry/bundler-plugins@10.75.0'
  - '@sentry/cli-darwin@3.8.0'
  - '@sentry/cli-linux-arm64@3.8.0'
  - '@sentry/cli-linux-arm@3.8.0'
  - '@sentry/cli-linux-i686@3.8.0'
  - '@sentry/cli-linux-x64@3.8.0'
  - '@sentry/cli-win32-arm64@3.8.0'
  - '@sentry/cli-win32-i686@3.8.0'
  - '@sentry/cli-win32-x64@3.8.0'
  - '@sentry/cli@3.8.0'
  - '@sentry/core@10.75.0'
  - '@sentry/expo-upload-sourcemaps@8.27.0'
  - '@sentry/feedback@10.75.0'
  - '@sentry/react-native@8.27.0'
  - '@sentry/react@10.75.0'
  - '@sentry/replay-canvas@10.75.0'
  - '@sentry/replay@10.75.0'
